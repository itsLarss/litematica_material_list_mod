plugins {
	id 'fabric-loom' version "${loom_version}"
}

def mc = project.property('mc')
def versionProps = new Properties()
file("versions/${mc}.properties").withInputStream { versionProps.load(it) }

version = versionProps.mod_version
group = project.maven_group

base {
	archivesName = 'schematic-tracker'
}

repositories {
	maven { url = 'https://maven.terraformersmc.com/releases/' }
}

// Versionsabhängiger Code liegt in src/compat/<gruppe>; innerhalb einer Gruppe ist die API gleich.
def patch = (mc.tokenize('.') + ['0', '0'])[2] as int
def compatGroup = patch >= 11 ? '1.21.11' : patch >= 9 ? '1.21.9' : patch >= 6 ? '1.21.6' : '1.21'

loom {
	splitEnvironmentSourceSets()
	mods {
		"schematic-tracker" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		client {
			runDir = "run-${mc}"
		}
	}
}

sourceSets {
	client {
		java {
			srcDir "src/compat/${compatGroup}/java"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${versionProps.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${versionProps.fabric_api_version}"

	// Optional: Einstellungen über Mod Menu
	modCompileOnly "com.terraformersmc:modmenu:${versionProps.modmenu_version}"

	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def props = [version: project.version, minecraft_range: versionProps.minecraft_range]
	inputs.properties props
	filesMatching("fabric.mod.json") { expand props }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from('LICENSE') { rename { "${it}_schematic-tracker" } }
}
